<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Unity WebGL Player | Safety Simulator</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    :root {
      color-scheme: light dark;
      --isl-vh: 1%;
    }

    * {
      box-sizing: border-box;
    }

    #unity-container {
      overflow: hidden;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, sans-serif;
      background: canvas;
      color: canvastext;
    }

    html.is-locked,
    html.is-locked body {
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100dvh;
      overscroll-behavior: none;
    }

    .holder {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: min(calc(var(--isl-vh) * 100), 100%);
      overflow: hidden;
      z-index: 2147483646;
      display: none;
    }

    html.is-locked .holder {
      display: block;
    }

    .scroller {
      display: block;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .scroller-inner {
      display: flex;
      justify-content: flex-start;
      align-items: stretch;
      flex-direction: column;
      height: calc(100% + 1px);
      min-height: calc(100% + 1px);
    }

    .content {
      display: flex;
      justify-content: flex-start;
      align-items: stretch;
      flex-direction: column;
      position: sticky;
      width: 100%;
      height: calc(100% - 1px);
      top: 0;
      bottom: 0;
    }

    .fullscreen-game {
      border-style: none;
      position: fixed;
      inset: 0;
      height: 100dvh;
      width: 100vw;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 12px env(safe-area-inset-right) 0 env(safe-area-inset-left);
      z-index: 2147483647;
      pointer-events: none;
    }

    .overlay.is-visible {
      display: flex;
    }

    .bubble {
      max-width: 80vw;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 96px;
      padding: 12px;
      font-size: 14px;
      pointer-events: auto;
    }

    .spacer {
      display: none;
      width: 1px;
      height: 2000vh;
    }

    .spacer.is-visible {
      display: block;
    }
  </style>
  <script>
    window.unityBackendUrl = "https://safety-game-backend-jrkle.ondigitalocean.app";
  </script>
</head>

<body>
  <!-- Safari Hider Structure -->
  <div class="holder">
    <div class="scroller">
      <div class="scroller-inner">
        <div class="content"></div>
      </div>
    </div>
  </div>
  <div class="overlay">
    <div class="bubble">
      Scroll down a bit to hide the browser bars and enjoy the full screen
    </div>
  </div>
  <div class="spacer"></div>

  <div id="unity-container" class="unity-desktop fullscreen-game">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Safety Simulator</div>
    </div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");
  
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }
  
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
  
      if (type == "error") {
        div.style = "background: red; padding: 10px; color: white;";
      } else {
        if (type == "warning") {
          div.style = "background: yellow; padding: 10px;";
        }
  
        setTimeout(function () {
          if (div.parentNode) warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
  
      updateBannerVisibility();
    }
  
    var buildUrl = "Build";
  
    async function loadUnity() {
      const parts = [
        buildUrl + "/new version.data.part.unitywebaa",
        buildUrl + "/new version.data.part.unitywebab"
      ];
  
      const responses = await Promise.all(parts.map((url) => fetch(url)));
  
      for (var i = 0; i < responses.length; i++) {
        if (!responses[i].ok) {
          unityShowBanner("Failed to load data part: " + parts[i], "error");
          return;
        }
      }
  
      const buffers = await Promise.all(responses.map((r) => r.arrayBuffer()));
  
      const totalLength = buffers.reduce((sum, b) => sum + b.byteLength, 0);
      const merged = new Uint8Array(totalLength);
  
      let offset = 0;
      for (const buf of buffers) {
        merged.set(new Uint8Array(buf), offset);
        offset += buf.byteLength;
      }
  
      const dataBlob = new Blob([merged], { type: "application/octet-stream" });
      const dataUrl = URL.createObjectURL(dataBlob);
  
      var config = {
        dataUrl: dataUrl,
        frameworkUrl: buildUrl + "/new version.framework.js.unityweb",
        codeUrl: buildUrl + "/new version.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Safety Simulator",
        productVersion: "0.2",
        showBanner: unityShowBanner
      };
  
      const isIOS =
        /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isMobile = isIOS || isAndroid;
  
      let safariActive = false;
      let measureRef = null;
  
      if (isMobile) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover";
  
        document.getElementsByTagName("head")[0].appendChild(meta);
  
        container.className = "unity-mobile fullscreen-game";
        canvas.className = "unity-mobile";
  
        canvas.style.width = "100%";
        canvas.style.height = "100%";
  
        if (isIOS) {
          const overlay = document.querySelector(".overlay");
          const spacer = document.querySelector(".spacer");
          const content = document.querySelector(".content");
  
          let tabsOpen = false;
          let rafId = null;
  
          safariActive = true;
  
          const nudge = () => window.scrollTo(0, 1);
          nudge();
          setTimeout(nudge, 100);
          setTimeout(nudge, 500);
  
          function measure() {
            if (rafId !== null) cancelAnimationFrame(rafId);
  
            rafId = requestAnimationFrame(() => {
              const viewport = window.visualViewport;
              const screenShort = Math.min(window.screen.width, window.screen.height);
              const MOBILE_CHROME_TOP_BAR_HEIGHT = 20;
  
              const open = !!viewport &&
                viewport.height + viewport.offsetTop <
                  screenShort - MOBILE_CHROME_TOP_BAR_HEIGHT;
  
              if (open === tabsOpen && !window.forceUpdate) return;
              tabsOpen = open;
              window.forceUpdate = false;
  
              const shouldLock = !open && isIOS;
              document.documentElement.classList.toggle("is-locked", shouldLock);
  
              overlay.classList.toggle("is-visible", open);
              spacer.classList.toggle("is-visible", open);
  
              Object.assign(container.style, {
                position: "fixed",
                inset: "0",
                height: "100dvh",
                width: "100vw",
                pointerEvents: open ? "none" : "auto", 
                zIndex: open ? "1" : "20"
              });
            });
          }
  
          measureRef = measure;
          measure();
  
          window.addEventListener("resize", measure, { passive: true });
          window.addEventListener("orientationchange", measure, { passive: true });
          window.addEventListener("scroll", measure, { passive: true });
  
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", measure, { passive: true });
            window.visualViewport.addEventListener("scroll", measure, { passive: true });
          }
        }
      } else {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }
  
      loadingBar.style.display = "block";
  
      var script = document.createElement("script");
      script.src = buildUrl + "/new version.loader.js";
  
      script.onload = () => {
        const startUnity = () => {
          if (window.unityInstanceStarted) return;
  
          window.unityInstanceStarted = true;
  
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              URL.revokeObjectURL(dataUrl);
  
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            })
            .catch((message) => {
              alert(message);
            });
        };
  
        const isCurrentlyWindowed =
          isIOS &&
          window.visualViewport &&
          window.visualViewport.height <
            Math.min(window.screen.width, window.screen.height) - 20;
  
        if (isCurrentlyWindowed) {
          window.addEventListener("safariBarsHidden", startUnity, { once: true });
          setTimeout(startUnity, 8000);
        } else {
          startUnity();
        }
      };
  
      document.body.appendChild(script);
    }
  
    loadUnity();
  </script>
</body>
</html>
